apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: pokefinder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pokefinder-backend
  template:
    metadata:
      labels:
        app: pokefinder-backend
    spec:
      containers:
        - name: backend
          image: 535833531373.dkr.ecr.us-east-1.amazonaws.com/pokefinder:backend-v1.0
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
