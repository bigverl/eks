apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-pokefinder-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:535833531373:certificate/79d5bb42-0e17-4aa1-acb4-52f056084bc7
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
    - host: www.pokefinder.net
      http:
        paths:
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-backend-service
                port:
                  number: 8000
          - path: /health/db
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-backend-service
                port:
                  number: 8000
          - path: /search_pokemon
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-backend-service
                port:
                  number: 8000
          - path: /team_coverage
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend-service
                port:
                  number: 80