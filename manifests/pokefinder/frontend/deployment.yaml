apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pokefinder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pokefinder-frontend
  template:
    metadata:
      labels:
        app: pokefinder-frontend
    spec:
      containers:
        - name: frontend
          image: 535833531373.dkr.ecr.us-east-1.amazonaws.com/pokefinder:frontend-v1.0
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi