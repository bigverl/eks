apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-pokefinder-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-backend-service
                port:
                  number: 8000
          - path: /health/db
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-backend-service
                port:
                  number: 8000
          - path: /search_pokemon
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-backend-service
                port:
                  number: 8000
          - path: /team_coverage
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend-service
                port:
                  number: 80
